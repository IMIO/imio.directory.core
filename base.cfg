[buildout]
show-picked-versions = true
extensions =
    mr.developer

sources-dir = devel

extends =
    https://dist.plone.org/release/6.2.3/versions.cfg
    https://dist.plone.org/release/6.2.3/versions-ecosystem.cfg
    https://dist.plone.org/release/6.2.3/versions-extra.cfg
    https://raw.githubusercontent.com/IMIO/buildout.smartweb/plone62/versions.cfg
    https://raw.githubusercontent.com/IMIO/buildout.smartweb/plone62/sources.cfg

parts =
    instance
    omelette
    plone-helper-scripts
    vscode

develop = .

auto-checkout +=
    imio.smartweb.common
    imio.helpers
    collective.behavior.talcondition
    collective.privacy

[instance]
recipe = plone.recipe.zope2instance
zodb-temporary-storage = off
user = admin:admin
http-address = 8080
environment-vars =
    zope_i18n_compile_mo_files true
eggs =
    Plone
    Pillow
    imio.directory.core
zcml =
    imio.directory.core
    imio.directory.core-overrides

[vscode]
recipe = collective.recipe.vscode
eggs = ${instance:eggs}
autocomplete-use-omelette = True

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[releaser]
recipe = zc.recipe.egg
eggs = zest.releaser

[plone-helper-scripts]
recipe = zc.recipe.egg
eggs =
   Products.CMFPlone
   ${instance:eggs}
interpreter = zopepy
scripts =
   zopepy

[versions]
# Don't use a released version of imio.directory.core
imio.directory.core =
# From buildout.directory's versions.cfg, which has no plone62 branch yet
# (its main branch pins plone.restapi 9.x, too old for Plone 6.2)
collective.schedulefield = 1.1
vobject = 0.9.6.1
